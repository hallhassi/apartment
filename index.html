    <a href="brianna-perry/index.html">brianna perry</a>
    <a href="blaise-larmee/index.html">blaise larmee</a>
    <a href="vogel-morra-and-kevin-larmee/index.html">vogel morra and kevin larmee</a>

<script>
    const imagePaths = [
        ['altcomics', 76],
        ['blaise-larmee', 11],
        ['brianna-perry', 67],
        ['kevin-larmee', 51],
        ['vogel-morra-and-kevin-larmee', 21]
    ].flatMap(([show, count]) =>
        Array.from({ length: count }, (_, index) => `${show}/${index + 1}.jpg`)
    );

    document.querySelectorAll('[data-show-link]').forEach(link => {
        link.href = `${link.dataset.show}/index.html`;
    });

    function appendRandomImage() {
        if (imagePaths.length === 0) return;

        const selectedPath = imagePaths[Math.floor(Math.random() * imagePaths.length)];
        const page = selectedPath.replace('.jpg', '.html');
        const imageLink = document.createElement('a');
        imageLink.href = page;
        const newImage = document.createElement('img');
        newImage.src = selectedPath;
        newImage.classList.add('random-body-image');
        newImage.alt = 'A randomly selected image';
        imageLink.appendChild(newImage);
        document.body.appendChild(imageLink);
    }

    appendRandomImage();
</script>




</body></html>
